---
name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    FORCE_COLOR: 1

jobs:

    pre-commit:

        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:

            - uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  python-version: '3.12'
                  activate-environment: true

            - name: Install dependencies
              run: uv pip install -e . --group dev

            - uses: j178/prek-action@v3.0.0


    test-package:

        runs-on: ubuntu-latest
        timeout-minutes: 15

        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
                default-image:
                    - ''   # use the application default

        steps:

            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v10.3.3
              with:
                  python-version: ${{ matrix.python-version }}
                  activate-environment: true

            - name: Run tests
              run: |
                  uv run pytest -sv --slow --default-image=${{ matrix.default-image }}
                  uv run coverage xml

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  flags: py-${{ matrix.python-version }}

    test-installation-with-uv:

        runs-on: ubuntu-latest
        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

        steps:

            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v10.3.3
              with:
                  python-version: ${{ matrix.python-version }}
                  activate-environment: true

            - name: Install with `uv tool`
              run: uv tool install ${{ github.workspace }}

            - name: Run smoke tests
              run: aiidalab-launch version
