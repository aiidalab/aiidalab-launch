[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiidalab_launch"
description = "Tool to launch AiiDAlab on a local workstation."
authors = [{name = "Carl Simon Adorf and the AiiDAlab team", email = "aiidalab@materialscloud.org"}]
dynamic = ["version"]
requires-python = '>=3.9'
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Framework :: AiiDA',
  'Operating System :: POSIX :: Linux',
  'Operating System :: MacOS :: MacOS X',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: Implementation :: CPython',
  'Topic :: Scientific/Engineering',
]

dependencies = [
  'click==8.1',
  'click-spinner==0.1.10',
  'docker==7.0.0',
  'packaging==21.3',
  'requests==2.26.0',
  'requests-cache==0.9.1',
  'tabulate==0.9.0',
  'toml==0.10.2',
]

[project.optional-dependencies]
dev = [
  'bumpver>=2023.1129',
  'pre-commit>=3.5.0',
]

tests = [
  'pytest~=7.4.3',
  'pytest-asyncio~=0.21.1',
  'pytest-cov~=4.1.0',
  'responses~=0.23.1',
]

[project.scripts]
aiidalab-launch = "aiidalab_launch.__main__:cli"

[project.urls]
Home = "https://github.com/aiidalab/aiidalab-launch"
Issues = "https://github.com/aiidalab/aiidalab-home/issues"


[tool.hatch.version]
path = "aiidalab_launch/version.py"

[tool.hatch.build.targets.wheel]
packages = ["aiidalab_launch"]


[tool.mypy]
warn_unused_configs = true
disallow_untyped_calls = true

[[tool.mypy.overrides]]
module = "docker.*"
ignore_missing_imports = true


[tool.pytest.ini_options]
addopts = ["--cov=aiidalab_launch", "--cov-fail-under=80"]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow"]
filterwarnings = ["ignore::DeprecationWarning:docker.*:"]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.bumpver]
current_version = "v2024.1020"
version_pattern = "vYYYY.BUILD[PYTAGNUM]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"aiidalab_launch/version.py" = [
    '__version__ = "{version}"',
]

[tool.coverage.run]
omit = [
  '*/venv/*',
  '*/tests/*',
  '*/docs/*',
  '*/dist/*',
]

[tool.coverage.html]
directory = './htmlcov'
